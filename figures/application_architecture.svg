<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
  <title id="title">Reactive Shiny application architecture</title>
  <desc id="desc">Validated CSV inputs flow through a shared data contract to namespaced reactive modules, then to plots, tables, and downloads, with tests around both data and modules.</desc>
  <rect width="1120" height="250" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ffffff" stroke="#256d85" stroke-width="3">
      <rect x="35" y="72" width="190" height="105" rx="16"/>
      <rect x="285" y="72" width="210" height="105" rx="16"/>
      <rect x="555" y="32" width="245" height="185" rx="16"/>
      <rect x="860" y="72" width="225" height="105" rx="16"/>
    </g>
    <g fill="#153243">
      <text x="130" y="110" font-size="20" font-weight="700">Teaching CSVs</text><text x="130" y="139" font-size="15">six explicit schemas</text>
      <text x="390" y="110" font-size="20" font-weight="700">Data contract</text><text x="390" y="139" font-size="15">columns · types · failures</text>
      <text x="677" y="68" font-size="20" font-weight="700">Namespaced modules</text><text x="677" y="100" font-size="15">differential expression</text><text x="677" y="126" font-size="15">longitudinal · microbiome</text><text x="677" y="152" font-size="15">pathways · sequencing QC</text><text x="677" y="184" font-size="14" fill="#d95f59">testServer reactive contracts</text>
      <text x="972" y="105" font-size="20" font-weight="700">User outputs</text><text x="972" y="134" font-size="15">plots · tables · downloads</text><text x="972" y="158" font-size="14" fill="#d95f59">HTTP smoke test</text>
    </g>
    <g stroke="#d95f59" stroke-width="4" fill="none"><path d="M225 124 H275"/><path d="M495 124 H545"/><path d="M800 124 H850"/></g>
    <g fill="#d95f59"><path d="M275 124 l-12 -8 v16 z"/><path d="M545 124 l-12 -8 v16 z"/><path d="M850 124 l-12 -8 v16 z"/></g>
  </g>
</svg>

